name: Noticias Forex Factory

on:
  push:
    paths: ["scripts/**", ".github/workflows/**"]
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Each source is independent: if one fails, the app keeps its previous data.
      - name: Forex Factory (cada 3 horas)
        id: ff
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o nuevo.json -w "%{http_code}" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
              "https://nfs.faireconomy.media/ff_calendar_thisweek.json" || true)
            echo "Intento $i: HTTP $code"
            if [ "$code" = "200" ] && head -c 1 nuevo.json | grep -q '\['; then
              python3 -c "import json; d=json.load(open('nuevo.json')); assert isinstance(d,list) and d; print(len(d),'noticias')"
              cmp -s nuevo.json ff-semana.json || mv nuevo.json ff-semana.json
              rm -f nuevo.json
              python3 scripts/estado.py ff
              exit 0
            fi
            sleep 60
          done
          rm -f nuevo.json
          echo "::warning::Forex Factory no ha dejado descargar esta vez. Se reintentará en la próxima ejecución."
          exit 1

      # Earnings and IPO dates rarely change: only twice a day (and when the scripts change).
      - name: ¿Toca consultar Nasdaq?
        id: turno
        run: |
          H=$(date -u +%H)
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$H" = "06" ] || [ "$H" = "18" ]; then echo "si=1" >> "$GITHUB_OUTPUT"; else echo "si=0" >> "$GITHUB_OUTPUT"; fi

      - name: Resultados de empresas
        if: steps.turno.outputs.si == '1'
        continue-on-error: true
        run: python3 scripts/resultados.py && python3 scripts/estado.py resultados

      - name: Grandes salidas a bolsa
        if: steps.turno.outputs.si == '1'
        continue-on-error: true
        run: python3 scripts/salidas.py && python3 scripts/estado.py salidas

      - name: Guardar cambios
        run: |
          git config user.name "noticias-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.json'
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "Actualiza noticias"
          git pull -q --rebase origin main || true
          git push
