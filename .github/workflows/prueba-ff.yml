name: Prueba noticias FF
on:
  push:
    paths: [".github/workflows/prueba-ff.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          rm -rf prueba; mkdir -p prueba
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          i=0
          for u in "https://www.forexfactory.com/news" "https://www.forexfactory.com/rss/news" "https://www.forexfactory.com/news.xml" "https://www.forexfactory.com/feed" "https://nfs.faireconomy.media/ff_news.xml" "https://nfs.faireconomy.media/ff_news.json"; do
            i=$((i+1))
            code=$(curl -sL -o prueba/r$i.txt -w "%{http_code}" -A "$UA" -H "Accept-Language: en-US,en;q=0.9" "$u" || true)
            echo "$u -> $code $(wc -c < prueba/r$i.txt)" >> prueba/resumen.txt
            if [ $i = 1 ]; then cp prueba/r$i.txt prueba/news.html; fi; head -c 4000 prueba/r$i.txt > prueba/r$i.head; rm prueba/r$i.txt
          done
          cat prueba/resumen.txt
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add prueba && git commit -m "prueba FF news" && git pull --rebase && git push
